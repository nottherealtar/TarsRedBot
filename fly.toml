app = "TarsRedBot"
primary_region = "jnb"

[build]
  builder = "dockerfile"

[deploy]
  release_command = "python manage.py migrate"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
